<!doctype html>
<!--
  Synthesized, not captured.

  ESPN's draft room usually renders the team on the clock in the title of its
  current-pick module. Sometimes it does not - the module appears with the
  pick number a beat before the name, which is exactly the moment a draft
  starts. This is that moment, reduced to nothing else, so a test can ask what
  the parser does when the page says which pick it is but not whose it is.

  Everything here was written by hand. It makes no claim about ESPN's real
  markup beyond the one hook the parser reads.
-->
<html lang="en">
  <head><meta charset="utf-8" /><title>Draft room</title></head>
  <body>
    <header>
      <div data-testid="current-pick">On the Clock: Pick 5</div>
      <div>RND 1 of 15</div>
    </header>
  </body>
</html>
