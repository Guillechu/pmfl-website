<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Fantasy Football Draft - ESPN</title>
<style>body { font: 14px system-ui; margin: 0; } div { min-height: 1px; }</style>
</head>
<body>
<!--
  Page furniture, and what the parser must refuse to read out of it.

  SYNTHESIZED, not captured - and deliberately so. A live 2026 draft room
  filled all 180 board slots with a player called "Team logo" at position
  UNKNOWN, every one credited to the team whose configured draft slot matched
  the coordinate. The two ingredients are known from the capture and from the
  screenshot that showed it: ESPN puts alt="Team logo" on fantasy club crests
  (the <img> below is verbatim from the capture), and the room renders
  "Round N" and "Pick M" close enough together to look like a coordinate. The
  exact container that combined them was never captured, so this reproduces
  the *shape* rather than claiming to be ESPN's markup.

  Nothing here is a draft selection. A parse of this page must find no picks
  at all - not one - however the elements are arranged.
-->

<!-- A crest and a coordinate in the same box. -->
<div class="pickArea">
  <div class="headings">
    <h3>You're on the clock in: 13 Picks</h3>
    <p>Round 2, Pick 12</p>
  </div>
  <div data-testid="croppable-image" class="croppable-image team-logo">
    <img alt="Team logo" class="Image team-logo" data-mptype="image" src="https://g.espncdn.com/lm-static/ffl/images/default_logos/8.svg">
  </div>
</div>

<!-- The same, with the coordinate written as a fully qualified pick. -->
<div class="cell">
  <span>3.07</span>
  <img alt="Team logo" src="https://g.espncdn.com/lm-static/ffl/images/default_logos/2.svg">
</div>

<!-- A crest beside an ordinary word that reads like a name. -->
<div class="cell">
  <span>Round 4</span><span>Pick 5</span>
  <img alt="Los Badros" src="https://g.espncdn.com/lm-static/ffl/images/default_logos/3.svg">
</div>

<!-- A coordinate with no player evidence of any kind. -->
<div class="cell"><span>Round 6, Pick 2</span><span>Autopick</span></div>

<!-- A crest whose alt is a bare word, beside a coordinate and a position.
     This is the one that reached the television as "TEAM, --, FREE AGENT". -->
<div class="cell">
  <span>Round 2, Pick 12</span><span>WR</span>
  <img alt="Team" src="https://g.espncdn.com/lm-static/ffl/images/default_logos/5.svg">
</div>
</body>
</html>
